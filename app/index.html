<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9ba29b">
  <link rel="icon" href="data:,">
  <meta name="description" content="A fully procedural offshore observation tower with weathered PBR materials and interactive 360-degree inspection.">
  <title>Offshore Observation Tower · 3D Inspection</title>
  <style>
    :root {
      color-scheme: light;
      --sky: #9ba29b;
      --ink: #202722;
      --panel: rgba(25, 31, 28, 0.84);
      --panel-hover: rgba(18, 23, 20, 0.96);
      --paper: #edf0e9;
      --muted: #c8cec5;
      --focus: #f2a36d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
    body { font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
    #scene, #scene canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #scene canvas { touch-action: none; cursor: grab; }
    #scene canvas:active { cursor: grabbing; }
    #scene canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: -3px; }
    .identity { position: fixed; z-index: 2; top: max(20px, env(safe-area-inset-top)); left: max(22px, env(safe-area-inset-left)); pointer-events: none; }
    .identity h1 { margin: 0; font-size: 13px; line-height: 1.3; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .identity p { margin: 5px 0 0; font: 10px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .hint, .reset, .wireframe {
      position: fixed;
      z-index: 2;
      bottom: max(16px, env(safe-area-inset-bottom));
      min-height: 44px;
      background: var(--panel);
      color: var(--paper);
      border: 1px solid rgba(237, 240, 233, 0.16);
      border-radius: 3px;
      backdrop-filter: blur(8px);
    }
    .hint { left: max(16px, env(safe-area-inset-left)); display: flex; align-items: center; padding: 0 14px; pointer-events: none; font: 10px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 0.04em; }
    .touch-hint { display: none; }
    .reset, .wireframe { right: max(16px, env(safe-area-inset-right)); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font: 600 12px/1 "Arial Narrow", "Helvetica Neue", Arial, sans-serif; cursor: pointer; transition: background 160ms ease, border-color 160ms ease, color 160ms ease; }
    .wireframe { top: max(20px, env(safe-area-inset-top)); bottom: auto; }
    .wireframe[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: rgba(32, 39, 34, 0.42); }
    .wireframe:disabled { opacity: 0.55; cursor: wait; }
    .reset:hover, .wireframe:hover:not(:disabled) { background: var(--panel-hover); border-color: rgba(237, 240, 233, 0.38); }
    .wireframe[aria-pressed="true"]:hover { background: #dce2d8; border-color: rgba(32, 39, 34, 0.58); }
    .reset:active, .wireframe:active:not(:disabled) { background: #111612; color: var(--paper); }
    .reset:focus-visible, .wireframe:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .reset svg, .wireframe svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .loading { position: fixed; z-index: 10; inset: 0; background: var(--sky) center / contain no-repeat; opacity: 1; visibility: visible; transition: opacity 220ms ease, visibility 0s 220ms; }
    .loading.is-complete { opacity: 0; visibility: hidden; pointer-events: none; }
    .load-panel { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(360px, calc(100% - 40px)); padding: 14px 16px; background: var(--panel); color: var(--paper); border-radius: 3px; text-align: center; }
    #loading-text { margin: 0; font-size: 13px; line-height: 1.5; }
    #loading-progress { height: 2px; margin-top: 11px; overflow: hidden; background: rgba(237, 240, 233, 0.18); }
    #loading-bar { display: block; width: 100%; height: 100%; background: #e88b4a; transform: scaleX(0.03); transform-origin: left; transition: transform 160ms ease; }
    .loading.has-error .load-panel { border: 1px solid rgba(237, 240, 233, 0.35); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 600px) {
      .identity { top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); }
      .identity h1 { font-size: 11px; }
      .identity p { font-size: 9px; }
      .hint { max-width: calc(100% - 158px); padding: 6px 10px; font-size: 9px; }
      .pointer-hint { display: none; }
      .touch-hint { display: inline; }
      .reset { padding: 0 12px; }
      .wireframe { top: max(16px, env(safe-area-inset-top)); width: 44px; padding: 0; }
      .wireframe .button-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="scene" aria-label="Offshore observation tower 3D viewer"></main>
  <header class="identity">
    <h1>Offshore Observation Tower</h1>
    <p>Procedural model · <span id="status">Loading asset</span></p>
  </header>
  <button class="wireframe" id="wireframe-view" type="button" aria-label="Show wireframe" aria-pressed="false" title="Toggle wireframe (F)" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9M8 5.25l8 4.5v9"/></svg>
    <span class="button-label">Wireframe</span>
  </button>
  <div class="hint" aria-hidden="true"><span class="pointer-hint">DRAG ORBIT · SCROLL ZOOM · RIGHT DRAG PAN</span><span class="touch-hint">DRAG ORBIT · PINCH ZOOM · TWO-FINGER PAN</span></div>
  <button class="reset" id="reset-view" type="button" aria-label="Reset to the reference camera view">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V3m0 0h5M4 3l4 4a8 8 0 1 1-2 7"/></svg>
    Reset view
  </button>
  <div class="loading" id="loading">
    <div class="load-panel">
      <p id="loading-text" role="status" aria-live="polite">Preparing overcast environment…</p>
      <div id="loading-progress" aria-hidden="true"><span id="loading-bar"></span></div>
    </div>
  </div>
  <noscript><p class="load-panel">JavaScript is required for interactive 3D inspection.</p></noscript>
  <span class="sr-only">Keyboard controls: arrow keys orbit, W A S D pan, plus and minus zoom, F toggles wireframe, Home resets the camera.</span>
  <script type="module" src="/src/scene.js"></script>
</body>
</html>
